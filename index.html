<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChessMaster AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e2e8f0;font:16px Arial}header{text-align:center;padding:18px;background:#162338}h1{margin:0;color:#38bdf8}.layout{max-width:1050px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,620px) 300px;gap:18px}.panel{background:#172338;border:1px solid #334155;border-radius:14px;padding:14px}.board{direction:ltr;display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:5px solid #334155}.sq{display:flex;justify-content:center;align-items:center;position:relative;cursor:pointer;user-select:none;font:clamp(25px,6vw,55px) "Segoe UI Symbol",serif}.light{background:#e2e8f0}.dark{background:#7993af}.selected{background:#facc15!important}.last{box-shadow:inset 0 0 0 4px #38bdf8aa}.hint:after{content:"";position:absolute;width:25%;height:25%;border-radius:50%;background:#16a34a99}.piece{z-index:1}.w{color:white;text-shadow:1px 1px 2px black,-1px -1px 2px black}.b{color:#111827;text-shadow:1px 1px 2px #fff}.row{display:flex;justify-content:space-between;align-items:center;padding:10px 2px}.clock{font:20px monospace;background:#0b1220;padding:9px;border-radius:8px}.active{color:#38bdf8}select,button{width:100%;padding:11px;margin:7px 0 13px;border-radius:8px;border:1px solid #475569;background:#0b1220;color:white;font-size:15px}button{background:#2563eb;border:0;font-weight:bold}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status,.moves{background:#0b1220;padding:12px;border-radius:8px}.status{text-align:center;color:#7dd3fc}.moves{height:180px;overflow:auto;direction:ltr;text-align:left;line-height:1.9}.note{color:#94a3b8;font-size:13px;line-height:1.6}@media(max-width:800px){.layout{grid-template-columns:1fr;padding:8px}.sq{font-size:clamp(27px,10vw,54px)}}
</style></head><body><header><h1>♟ ChessMaster AI</h1><small>שחמט נגד מחשב · שש רמות קושי</small></header><main class="layout"><section class="panel"><div class="row">🤖 מחשב <span class="clock" id="bc">10:00</span></div><div class="board" id="board"></div><div class="row">👤 אתה <span class="clock" id="hc">10:00</span></div><div class="status" id="status"></div><p id="thinking"></p></section><aside class="panel"><h2>הגדרות</h2><label>רמת קושי</label><select id="level"><option value="1">1 — מתחיל</option><option value="2">2 — קל</option><option value="3" selected>3 — בינוני</option><option value="4">4 — קשה</option><option value="5">5 — מומחה</option><option value="6">6 — מאסטר</option></select><label>צבע הכלים שלך</label><select id="side"><option value="w">לבן</option><option value="b">שחור</option></select><label>שעון</label><select id="time"><option value="0">ללא שעון</option><option value="180">3 דקות</option><option value="300">5 דקות</option><option value="600" selected>10 דקות</option><option value="900">15 דקות</option></select><div class="buttons"><button onclick="newGame()">משחק חדש</button><button onclick="undoMove()">בטל מהלך</button></div><h2>מהלכים</h2><div class="moves" id="moves"></div><p class="note">המשחק משתמש ב-Chess.js לחוקים ובמנוע Minimax לרמות הקושי. נדרש אינטרנט לטעינת הספרייה. ברמת מאסטר אין מנוע Stockfish.</p></aside></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script>
if(typeof Chess==='undefined'){document.getElementById('status').textContent='לא ניתן לטעון את ספריית השחמט. בדוק חיבור לאינטרנט.';throw Error('Chess.js unavailable')}
const $=id=>document.getElementById(id),icons={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}},value={p:100,n:320,b:330,r:500,q:900,k:20000};
let game,human,bot,selected,last,thinking=false,finished=false,clocks,enabled,started=false,timer,version=0;
function newGame(){version++;clearTimeout(timer);game=new Chess();human=$('side').value;bot=human==='w'?'b':'w';selected=null;last=null;thinking=false;finished=false;started=true;clocks={w:+$('time').value,b:+$('time').value};enabled=clocks.w>0;$('thinking').textContent='';render();if(bot==='w')scheduleBot()}
function render(){const board=$('board');board.innerHTML='';const files=human==='w'?'abcdefgh':'hgfedcba',ranks=human==='w'?'87654321':'12345678',legal=selected?game.moves({square:selected,verbose:true}):[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){const sq=files[c]+ranks[r],p=game.get(sq),el=document.createElement('div');el.className='sq '+((r+c)%2?'dark':'light');if(sq===selected)el.classList.add('selected');if(last&&(last.from===sq||last.to===sq))el.classList.add('last');if(legal.some(m=>m.to===sq))el.classList.add('hint');if(p){const span=document.createElement('span');span.className='piece '+p.color;span.textContent=icons[p.color][p.type];el.appendChild(span)}el.onclick=()=>click(sq);board.appendChild(el)}const h=game.history();$('moves').innerHTML=Array.from({length:Math.ceil(h.length/2)},(_,i)=>`${i+1}. ${h[2*i]||''}　${h[2*i+1]||''}<br>`).join('');$('moves').scrollTop=$('moves').scrollHeight;clockRender();status()}
function click(sq){if(!started||finished||thinking||game.turn()!==human)return;const p=game.get(sq);if(selected&&game.moves({square:selected,verbose:true}).some(m=>m.to===sq)){last=game.move({from:selected,to:sq,promotion:'q'});selected=null;render();if(!game.game_over())scheduleBot();return}selected=p&&p.color===human?sq:null;render()}
function status(){if(finished)return;if(game.in_checkmate()){finished=true;$('status').textContent=game.turn()===human?'הבוט ניצח במט':'ניצחת במט!'}else if(game.in_draw()){finished=true;$('status').textContent='תיקו'}else if(game.in_check())$('status').textContent='שח!';else $('status').textContent=game.turn()===human?'התור שלך':'תור הבוט'}
function order(moves){return [...moves].sort((a,b)=>priority(b)-priority(a))}function priority(m){return(m.captured?10*value[m.captured]-value[m.piece]:0)+(m.promotion?value[m.promotion]:0)}
function evaluate(){let sum=0,side=game.turn();game.board().forEach((row,r)=>row.forEach((p,c)=>{if(!p)return;const center=7-Math.abs(c-3.5)-Math.abs(r-3.5),advance=p.color==='w'?6-r:r-1;let v=value[p.type];if(p.type==='p')v+=advance*9+center*2;if(p.type==='n')v+=center*11;if(p.type==='b')v+=center*5;sum+=(p.color===side?1:-1)*v}));return sum}
function search(depth,alpha,beta){if(game.in_checkmate())return -100000-depth;if(game.in_draw())return 0;if(!depth)return evaluate();let best=-Infinity;for(const m of order(game.moves({verbose:true}))){game.move(m);const s=-search(depth-1,-beta,-alpha);game.undo();best=Math.max(best,s);alpha=Math.max(alpha,s);if(alpha>=beta)break}return best}
function choose(){const moves=game.moves({verbose:true}),level=+$('level').value;if(level===1)return moves[Math.random()*moves.length|0];const depth=level<=2?1:level<=4?2:3,noise=[0,0,160,70,15,8,0][level];let best=-Infinity,choice=moves[0];for(const m of order(moves)){game.move(m);const score=-search(depth-1,-Infinity,Infinity)+Math.random()*noise;game.undo();if(score>best){best=score;choice=m}}return choice}
function scheduleBot(){thinking=true;$('thinking').textContent='הבוט חושב...';const v=version;timer=setTimeout(()=>{if(v!==version||finished||game.game_over())return;last=game.move(choose());thinking=false;$('thinking').textContent='';render()},150)}
function undoMove(){version++;clearTimeout(timer);thinking=false;$('thinking').textContent='';if(!game.history().length)return;game.undo();if(game.turn()!==human&&game.history().length)game.undo();selected=null;last=null;finished=false;render();if(game.turn()===bot&&!game.game_over())scheduleBot()}
function clockRender(){for(const [color,id] of [[human,'hc'],[bot,'bc']]){const e=$(id),t=Math.max(0,Math.ceil(clocks[color]));e.textContent=enabled?String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0'):'∞';e.classList.toggle('active',game.turn()===color)}}
setInterval(()=>{if(!started||finished||!enabled||game.game_over())return;const side=game.turn();clocks[side]--;if(clocks[side]<=0){clocks[side]=0;finished=true;version++;clearTimeout(timer);thinking=false;$('thinking').textContent='';$('status').textContent=side===human?'נגמר הזמן — הבוט ניצח':'נגמר הזמן לבוט — ניצחת!'}clockRender()},1000);newGame();
</script></body></html>
